name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip

      - name: Enforce golden update policy (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          GOLDEN_CHANGED="$(printf '%s\n' "$CHANGED_FILES" | grep -E '^tests/golden/(expected|scenarios)/' || true)"

          if [ -z "$GOLDEN_CHANGED" ]; then
            echo "No golden scenario/expected updates detected."
            exit 0
          fi

          echo "Golden files changed:"
          printf '%s\n' "$GOLDEN_CHANGED"

          if printf '%s\n' "$CHANGED_FILES" | grep -q '^docs/GOLDEN_WORKFLOW.md$'; then
            echo "Golden policy satisfied: docs/GOLDEN_WORKFLOW.md updated in this PR."
            exit 0
          fi

          if printf '%s' "${PR_BODY:-}" | grep -q '\[golden-update-approved\]'; then
            echo "Golden policy satisfied: PR description contains [golden-update-approved]."
            exit 0
          fi

          if printf '%s' "${PR_LABELS:-}" | grep -q 'golden-update-approved'; then
            echo "Golden policy satisfied: PR label golden-update-approved present."
            exit 0
          fi

          echo "ERROR: Golden files changed without required approval marker."
          echo "Add docs/GOLDEN_WORKFLOW.md changes, or include [golden-update-approved] in PR description,"
          echo "or apply PR label golden-update-approved."
          exit 1

      - name: Lint (syntax smoke)
        run: |
          python -m compileall -q apps packages tests

      - name: Unit tests
        run: |
          python -m unittest \
            tests/data_adapter/test_parsers.py \
            tests/data_adapter/test_runtime_builder.py \
            tests/golden/test_bootstrap_script.py \
            tests/runtime_loader/test_runtime_data_loader.py \
            tests/planner_core/test_pure_planner_parity.py \
            tests/planner_core/test_runtime_loader_e2e.py \
            tests/planner_core/test_locked_semantics.py \
            tests/api/test_generate_endpoint.py \
            tests/web/test_ui_smoke.py

      - name: Stdlib E2E request smoke
        run: |
          python -m apps.api.server > /tmp/api-stdlib.log 2>&1 &
          API_PID=$!
          trap "kill $API_PID" EXIT
          sleep 1

          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST http://127.0.0.1:8000/v1/pathways/generate \
            -H "Content-Type: application/json" \
            -d '{"college_id":"de_anza","target_ucs":["UCLA"],"ge_pattern":"IGETC","completed_courses":["MATH 1A"]}')

          test "$HTTP_CODE" = "200"

          python - <<'PY'
          import json
          with open("/tmp/resp.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          assert data.get("version") == "v1"
          assert isinstance(data.get("plan"), list)
          assert isinstance(data.get("warnings"), list)
          print("E2E smoke response OK")
          PY

  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip

      - name: Golden suites gate
        run: |
          scripts/golden --suite phase_a
          scripts/golden --suite full

      - name: Determinism gate
        run: |
          scripts/determinism --suite full --repeat 10

      - name: Reliability gate
        run: |
          scripts/reliability_check --suite phase_a --repeat 2 --threshold 0.99

      - name: Perf gate
        run: |
          scripts/perf --suite phase_a --repeat 3 --warmup 1 --threshold-seconds 2.0

  fastapi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi uvicorn

      - name: Start FastAPI backend and hit smoke routes
        run: |
          uvicorn apps.backend.main:app --host 127.0.0.1 --port 8100 > /tmp/api-fastapi.log 2>&1 &
          API_PID=$!
          trap "kill $API_PID" EXIT
          sleep 2

          curl -fsS http://127.0.0.1:8100/v1/health > /tmp/fastapi-health.json
          curl -fsS http://127.0.0.1:8100/v1/metadata/ucs > /tmp/fastapi-ucs.json

          python - <<'PY'
          import json

          with open("/tmp/fastapi-health.json", "r", encoding="utf-8") as f:
              health = json.load(f)
          with open("/tmp/fastapi-ucs.json", "r", encoding="utf-8") as f:
              ucs = json.load(f)

          assert health.get("version") == "v1"
          assert health.get("status") in {"ok", "degraded"}
          assert ucs.get("version") == "v1"
          assert isinstance(ucs.get("data"), list)
          print("FastAPI smoke routes OK")
          PY

  parity-placeholder:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      - unit-lint
      - gates
      - fastapi-smoke

    steps:
      - name: P8-7 parity gate placeholder
        run: |
          echo "Parity heavy suite (P8-7) not wired yet."
          echo "CI plumbing is active via this placeholder job."
