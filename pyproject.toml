[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-pathway-planner"
version = "0.1.0"
description = "Transfer Pathway Planner migration tooling baseline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
migration = [
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "mypy>=1.10,<2",
  "ruff>=0.5,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
