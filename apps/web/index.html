<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transfer Pathway Planner (MVP)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#planner-form">Skip to planner form</a>
    <main class="container">
      <h1>Transfer Pathway Planner</h1>
      <p class="subtle">Student planner setup workflow</p>

      <form id="planner-form" class="panel">
        <div class="field">
          <label for="college_id">College</label>
          <select id="college_id" name="college_id" required>
            <option value="">Loading colleges...</option>
          </select>
        </div>

        <div class="field">
          <label for="target_ucs">Target UCs</label>
          <select
            id="target_ucs"
            name="target_ucs"
            multiple
            size="3"
            required
            aria-describedby="target-ucs-help"
          >
            <option value="">Loading UCs...</option>
          </select>
          <small id="target-ucs-help">Hold Ctrl/Cmd to select multiple</small>
        </div>

        <div class="field">
          <label for="ge_pattern">GE Pattern</label>
          <select id="ge_pattern" name="ge_pattern" required>
            <option value="IGETC" selected>IGETC</option>
            <option value="7CoursePattern">7CoursePattern</option>
          </select>
        </div>

        <div class="field">
          <label for="completed_courses">Completed Courses (one per line)</label>
          <textarea
            id="completed_courses"
            name="completed_courses"
            rows="6"
            placeholder="MATH 1A&#10;CIS 22A"
          ></textarea>
        </div>

        <button id="submit-button" type="submit">Generate Pathway</button>
      </form>

      <section id="setup-errors-panel" class="panel panel-error" aria-live="polite" hidden>
        <h2>Form Validation</h2>
        <ul id="setup-errors-list"></ul>
      </section>

      <section id="api-error-panel" class="panel panel-error" aria-live="polite" hidden>
        <h2>Request Error</h2>
        <p id="api-error-headline"></p>
        <ul id="api-error-details"></ul>
      </section>

    </main>

    <script src="./config.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
